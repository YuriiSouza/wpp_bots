name: Release Desktop

# Dispara ao enviar uma tag de versão (ex.: git tag v1.2.2 && git push origin v1.2.2),
# ou manualmente pela aba Actions do GitHub.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # necessário para o electron-builder criar a Release

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore service-account key
        shell: bash
        run: printf '%s' "$SERVICE_ACCOUNT_JSON" > service-account.local.json
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}

      - name: Build and publish to GitHub Releases
        run: |
          npm run build
          npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
